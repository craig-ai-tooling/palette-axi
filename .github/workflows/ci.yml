name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (dev deps only — palette-axi itself is stdlib-only at runtime)
        run: python3 -m pip install --upgrade pip && python3 -m pip install -e ".[dev]"

      - name: Syntax check (palette-axi is stdlib-only, no runtime deps)
        run: python3 -m compileall palette_axi

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: --help smoke test (no network, no credentials required)
        run: |
          python3 -m palette_axi --help
          for verb in projects clusters cluster profiles profile edgehosts events packs doctor; do
            python3 -m palette_axi "$verb" --help
          done
